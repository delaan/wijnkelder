<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#641027" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wijnkast" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Zet de verbinding met het icoon-CDN alvast klaar (DNS + TLS), zodat
         het ophalen van het stylesheet hieronder — nodig voor alle iconen,
         inclusief die boven de vouw — geen extra rondje meer kost. -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <!-- Font Awesome Free (iconen in de hele app) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
    <!-- Start het laden van de standaard dashboard-/gastmodusfoto meteen, parallel aan de app zelf,
         zodat hij al (grotendeels) klaar is tegen de tijd dat het scherm hem nodig heeft. -->
    <link rel="preload" as="image" href="/hero-default.jpg" fetchpriority="high" />
    <title>Wijnkast — mijn wijncollectie</title>
    <meta name="description" content="Beheer, ontdek en presenteer je persoonlijke wijncollectie — op iPhone, iPad en desktop." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
